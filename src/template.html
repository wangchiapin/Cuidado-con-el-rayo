<!doctype html>
<html lang="zh-Hant" data-hg-nocopy>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>天打雷劈｜¡Cuidado con el rayo!</title>
<meta name="theme-color" content="#F4F0E6">
<style>
:root{
  --paper:#F4F0E6; --paper2:#FBF8F0; --key:#EAE3D2; --keyb:#CFC7B2; --ink:#3B3B38; --ink2:#6E6A5E; --ink3:#8A8678;
  --red:#B5584A; --redbg:#F1DAD3; --line:#D8D2C4; --ok:#5E7F5A;
  --font:"Noto Sans TC","PingFang TC","Microsoft JhengHei","Heiti TC",system-ui,-apple-system,"Segoe UI",sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;background:var(--paper);color:var(--ink);font-family:var(--font);overscroll-behavior:none;touch-action:manipulation;-webkit-user-select:none;user-select:none}
button{font-family:inherit;color:inherit}
#app{height:100vh;height:100dvh;max-width:520px;margin:0 auto;display:flex;flex-direction:column;position:relative;overflow:hidden}
.screen{flex:1;display:flex;flex-direction:column;min-height:0}
[hidden]{display:none!important}
.tl{display:block;font-size:.72em;color:var(--ink3);font-weight:400;line-height:1.2;margin-top:1px}

/* ---------- 首頁 ---------- */
#start{overflow-y:auto;-webkit-overflow-scrolling:touch}
#start .inner{flex:1 0 auto;padding:16px 18px 8px;display:flex;flex-direction:column;align-items:center;justify-content:flex-start}
#heroWrap{position:relative;width:100%;aspect-ratio:360/290;background:var(--paper2);border:1px solid var(--line);border-radius:8px;margin-top:6px;overflow:hidden}
#start .inner h1{margin-top:0}
#start .inner .nameIn{margin-top:12px;text-align:center}
#start .inner #segGender{align-self:stretch;margin-top:10px}
@media(max-width:560px){#start .inner{padding-top:16px}}
/* 手機版首頁：標題放大、圖片吃掉中間剩下的空間（最高到寬度的 1.02 倍，人物不要比階梯大太多），名字欄加高 */
@media(max-width:699px){
  #start h1{font-size:38px}
  #start .sub{font-size:16px}
  #heroWrap{aspect-ratio:auto;flex:1 1 auto;min-height:calc((100vw - 36px)*.6);max-height:calc((100vw - 36px)*1.02)}
  #heroChar{height:min(52%,calc((100vw - 36px)*.5))}
  #start .inner .nameIn{min-height:58px;font-size:19px}
}
/* 電腦版首頁：欄放寬、標題放大；圖片高度算到剛好整頁不用捲動（--hh），名字欄、男女選項跟圖片同寬，開始鈕不要太寬 */
@media(min-width:700px){
  #app:has(#start:not([hidden])){max-width:820px}
  #start{--hh:clamp(210px,calc(100dvh - 465px),560px);--hw:calc(var(--hh)*1.24)}
  #start .inner{padding-top:20px;padding-bottom:0;flex:0 0 auto}   /* 電腦版：開始鈕緊接在男生／女生下面，不貼到視窗最底 */
  #start h1{font-size:46px;margin-top:4px}
  #start .sub{font-size:18px;margin:4px 0 6px}
  #heroWrap{aspect-ratio:auto;flex:none;height:var(--hh);width:var(--hw);margin:6px auto 0}
  #start .inner .nameIn{width:var(--hw);margin-left:auto;margin-right:auto;min-height:56px;font-size:20px}
  #start .inner #segGender{align-self:center;width:var(--hw)}
  #startBar{display:flex;justify-content:center;padding-top:2px;margin-top:8px}
  #start #startBar .big{width:340px;align-self:center}
}
/* 矮視窗（電腦視窗不高、小手機）：標題縮小、拿掉副標的西文行，讓整頁還是不用捲動 */
@media(min-width:700px) and (max-height:680px){
  #start{--hh:clamp(170px,calc(100dvh - 440px),560px)}
  #start h1{font-size:36px}
  #start .sub{margin:2px 0 4px;font-size:16px}
  #start .sub .tl{display:none}
}
@media(max-width:699px) and (max-height:620px){
  #start h1{font-size:32px}
  #start .sub{margin:2px 0 6px;font-size:14px}
  #start .sub .tl{display:none}
  #heroWrap{min-height:calc((100vw - 36px)*.42)}
  #start .inner .nameIn{min-height:50px}
}
/* 街景只畫一次：整張當成背景圖（手機不用一直重畫上百個向量圖形，避免 iPhone 記憶體不夠、整頁被系統重開） */
.streetBg{background-repeat:no-repeat;background-position:50% 85%;background-size:cover}
#heroWrap>.streetBg{position:absolute;inset:0;background-position:50% 0,0 0;background-size:100% auto,100% 100%}
#heroWrap .clouds{position:absolute;left:0;right:0;top:-8px;height:34%;opacity:.7}
#heroWrap .clouds svg{width:100%;height:100%;display:block}
#heroChar{position:absolute;left:0;right:0;bottom:3%;height:52%;display:flex;justify-content:center}
#heroChar svg{height:100%;width:auto}
h1{font-size:30px;margin:14px 0 2px;font-weight:700;letter-spacing:.08em;text-align:center}
h1 .bolt{display:inline-block;height:1.15em;width:auto;vertical-align:-.2em;margin-right:.1em;transform:rotate(8deg)}
h1 .zapman{display:inline-block;height:1.15em;width:auto;vertical-align:-.2em;margin-left:.1em}
h1 .tl{font-size:.46em;letter-spacing:0;margin-top:3px}
.sub{font-size:14px;color:var(--ink2);text-align:center;margin:6px 0 10px;line-height:1.5}
.how{align-self:stretch;margin:0 0 6px;padding:10px 12px;background:var(--paper2);border:1px solid var(--line);border-radius:8px;font-size:13px;line-height:1.45;color:var(--ink2)}
.how div+div{margin-top:6px}
.how .tl{font-size:.9em}
.grp{align-self:stretch;margin-top:10px}
.grp .lab{font-size:12px;color:var(--ink3);margin:0 0 5px 2px}
.seg{display:flex;gap:6px}
.seg button{flex:1;min-height:44px;padding:6px 4px;border-radius:8px;border:1px solid var(--keyb);background:var(--key);font-size:15px;line-height:1.2;cursor:pointer}
.seg button.on{background:var(--ink);border-color:var(--ink);color:var(--paper2)}
.seg button.on .tl{color:#D8D2C4}
#startBar{position:sticky;bottom:0;padding:10px 18px calc(12px + env(safe-area-inset-bottom));background:var(--paper);margin-top:14px;z-index:2}
.big{width:100%;min-height:54px;border-radius:10px;border:0;background:var(--red);color:#fff;font-size:20px;font-weight:700;letter-spacing:.2em;cursor:pointer}
.big .tl{color:#F5DDD6;letter-spacing:0;font-size:.6em}
.big:active{transform:scale(.985)}
.ghost{min-height:46px;padding:8px 14px;border-radius:10px;border:1px solid var(--keyb);background:var(--key);font-size:16px;cursor:pointer}

/* ---------- 遊戲畫面 ---------- */
#hud{position:relative;z-index:4;flex:0 0 auto;display:flex;align-items:center;gap:14px;padding:8px 58px 4px 14px;min-height:46px;background:linear-gradient(rgba(244,240,230,.92),rgba(244,240,230,.6) 70%,rgba(244,240,230,0))}
.stat{font-size:12px;color:var(--ink2);line-height:1.15;white-space:nowrap}
.stat b{font-size:17px;color:var(--ink);font-weight:700}
#stStrike b{color:var(--red)}
#hud .sp{flex:1}
#btnPause{width:40px;height:40px;border-radius:50%;border:1px solid var(--keyb);background:var(--key);font-size:15px;line-height:1;cursor:pointer;padding:0}

#scene{position:absolute;inset:0;background:#CDBFA8;overflow:hidden;--storm:0}
#world{position:absolute;left:50%;top:0;pointer-events:none;background-repeat:no-repeat;background-position:0 0,0 0;background-size:100% auto,100% 100%;will-change:transform}
#world.mv{transition:transform .75s cubic-bezier(.4,.1,.25,1)}
#world::after{content:'';position:absolute;left:0;right:0;top:var(--ih,100%);bottom:0;background:linear-gradient(rgba(42,36,32,0),rgba(42,36,32,.55) 60%)}   /* 圖片下面鋪滿的地面，越下面越暗 */
#player{position:absolute;left:0;top:0;pointer-events:none;transform-origin:50% 95.6%}
#player.mv{transition:transform .75s cubic-bezier(.4,.1,.25,1)}
#player svg{height:100%;width:100%;display:block;transform-origin:50% 100%}
#player.hop svg{animation:hop .4s ease-out}
#player.zap svg{animation:zap .6s linear forwards}
#player.hit svg{transform:rotate(24deg) translateX(2px)}
#world.zin,#player.zin{transition:scale .9s cubic-bezier(.45,.05,.25,1),translate .9s cubic-bezier(.45,.05,.25,1),transform .75s cubic-bezier(.4,.1,.25,1)}
#player.tired svg{animation:pant .55s ease-in-out infinite;overflow:visible;transform-origin:50% 100%}
@keyframes pant{0%,100%{transform:scale(1.03,.9) rotate(2deg)}50%{transform:scale(1.06,.87) rotate(-2deg)}}
#player.tired .mn{display:none}#player.tired .mx{display:inline}
#player.tired .al{transform:rotate(-26deg);transform-origin:12.5px 40px}#player.tired .ar{transform:rotate(26deg);transform-origin:47.5px 40px}
#player .pf{position:absolute;pointer-events:none;font-weight:700;color:#fff;text-shadow:0 0 3px #4A4F52,0 0 3px #4A4F52,0 1px 3px rgba(0,0,0,.5);font-size:calc(var(--pw,30px)*.42);animation:puff 1.1s ease-out infinite;opacity:0}
@keyframes puff{0%{opacity:0;transform:translate(0,0) scale(.7)}25%{opacity:1}100%{opacity:0;transform:translate(var(--px,14px),-14px) scale(1.15)}}
#player .sw{position:absolute;width:calc(var(--pw,30px)*.1);height:calc(var(--pw,30px)*.15);background:#8EC3E6;border:1px solid #5E86B8;border-radius:50% 50% 50% 50%/65% 65% 38% 38%;animation:sweat .9s ease-in infinite;opacity:0}
@keyframes sweat{0%{opacity:0;transform:translateY(0)}20%{opacity:1}100%{opacity:0;transform:translateY(calc(var(--pw,30px)*.4))}}
#player.cheer svg{animation:cheer .6s ease-out 5;overflow:visible}
#player.cheer .al,#player.cheer .ar{animation-duration:.6s;animation-iteration-count:5;animation-timing-function:ease-in-out}
#player.cheer .al{transform-origin:12.5px 40px;animation-name:armL}
#player.cheer .ar{transform-origin:47.5px 40px;animation-name:armR}
@keyframes armL{0%{transform:rotate(55deg)}40%{transform:rotate(160deg)}75%{transform:rotate(150deg)}100%{transform:rotate(55deg)}}
@keyframes armR{0%{transform:rotate(-55deg)}40%{transform:rotate(-160deg)}75%{transform:rotate(-150deg)}100%{transform:rotate(-55deg)}}
@keyframes cheer{0%{transform:translateY(0) scale(1,1)}14%{transform:translateY(0) scale(1.1,.88)}46%{transform:translateY(-48%) scale(.94,1.08) rotate(-5deg)}78%{transform:translateY(0) scale(1.08,.92) rotate(3deg)}100%{transform:translateY(0) scale(1,1)}}
.cf{position:absolute;top:-16px;width:8px;height:12px;border-radius:2px;animation:cfall var(--d) linear forwards}
@keyframes cfall{from{transform:translate(0,0) rotate(0);opacity:1}85%{opacity:1}to{transform:translate(var(--dx),calc(100vh + 40px)) rotate(var(--rot));opacity:.9}}
.topTxt{position:absolute;left:0;right:0;top:9%;text-align:center;font-size:46px;font-weight:700;letter-spacing:.1em;color:#fff;text-shadow:0 2px 0 #B5584A,0 0 14px rgba(217,164,65,.9),0 3px 10px rgba(0,0,0,.35);animation:topPop .5s cubic-bezier(.3,1.6,.5,1) both}
.topTxt .tl{display:block;font-size:.38em;letter-spacing:0;margin-top:2px;color:#fff;font-weight:600}
@keyframes topPop{from{transform:scale(.2);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes hop{0%{transform:translateY(0)}40%{transform:translateY(-12px)}100%{transform:translateY(0)}}
@keyframes zap{0%{transform:translateX(0)}12%{transform:translateX(-3px)}24%{transform:translateX(3px)}36%{transform:translateX(-2px)}48%{transform:translateX(2px)}100%{transform:rotate(24deg) translateX(2px)}}
.ex,.mx,.soot{display:none}
.hit .en,.hit .mn{display:none}
.hit .ex,.hit .mx{display:inline}
.hit .soot{display:inline}
#veil{position:absolute;inset:0;background:#2E3542;opacity:calc(var(--storm) * .3);pointer-events:none;transition:opacity .5s}
#clouds{position:absolute;left:-6%;right:-6%;top:-12px;height:60px;pointer-events:none;opacity:calc(.5 + var(--storm) * .5);transition:opacity .5s}
#clouds svg{width:100%;height:100%;display:block;animation:drift 14s ease-in-out infinite alternate}
@keyframes drift{from{transform:translateX(-3%)}to{transform:translateX(3%)}}
#bolt{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;opacity:0;filter:drop-shadow(0 0 5px #FFF3B0)}
#bolt.on{animation:bolt .65s linear}
@keyframes bolt{0%{opacity:0}6%{opacity:1}38%{opacity:1}48%{opacity:.55}58%{opacity:1}100%{opacity:0}}
#fx{position:absolute;inset:0;pointer-events:none}
.sp1{position:absolute;width:7px;height:7px;border-radius:50%;animation:spark .6s ease-out forwards}
@keyframes spark{from{transform:translate(0,0) scale(1);opacity:1}to{transform:translate(var(--dx),var(--dy)) scale(.3);opacity:0}}
#flash{position:absolute;inset:0;background:#FFFBEA;opacity:0;pointer-events:none}
#flash.on{animation:fl .55s ease-out}
@keyframes fl{from{opacity:.55}to{opacity:0}}
#scene.shake{animation:shk .3s linear}
@keyframes shk{0%,100%{transform:translateX(0)}20%{transform:translateX(-5px)}40%{transform:translateX(5px)}60%{transform:translateX(-3px)}80%{transform:translateX(3px)}}

#sheet{position:absolute;left:0;right:0;bottom:0;z-index:3;display:flex;flex-direction:column;background:rgba(244,240,230,.97);border-radius:18px 18px 0 0;box-shadow:0 -8px 22px rgba(0,0,0,.22);transform:translateY(106%);transition:transform .28s ease;pointer-events:none}
#play.sheetUp #sheet{transform:none;pointer-events:auto}
#qa{flex:0 0 auto;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding:12px 12px 6px;gap:6px}
#board{position:relative;align-self:stretch;margin:0 4px;display:flex;align-items:center;justify-content:center;gap:14px;padding:2px 0 8px;background:var(--paper2);border:1px solid var(--line);border-radius:10px;overflow:hidden}
#ch{font-size:clamp(44px,min(17vw,9dvh),72px);line-height:1.08;font-weight:500}
#spk{width:44px;height:44px;border-radius:50%;border:1px solid var(--keyb);background:var(--key);font-size:19px;cursor:pointer;padding:0}
#timer{position:absolute;left:0;right:0;bottom:0;height:5px;background:#E6E0D0}
#timerBar{display:block;height:100%;width:100%;background:var(--ink);transform-origin:0 50%}
#timer.low #timerBar{background:var(--red)}
#typed{align-self:stretch;margin:0 6px;min-height:44px;display:flex;align-items:center;justify-content:center;border-bottom:2px solid var(--ink)}
#typedTxt{flex:1;font-size:28px;font-weight:500;letter-spacing:.06em;min-width:40px;text-align:center;min-height:36px;line-height:36px}
#typedTxt b{color:var(--red);font-weight:700;margin-left:2px}
#typedTxt.bad{color:var(--red);animation:shk .28s linear}
#typedTxt.done{color:var(--ink2)}
.kbsw{display:flex;border:1px solid var(--keyb);border-radius:8px;overflow:hidden}
.kbsw button{width:34px;height:36px;border:0;background:var(--key);font-size:15px;padding:0;cursor:pointer}
.kbsw button.on{background:var(--ink);color:var(--paper2)}
#info .tag{font-size:14px;color:var(--red);font-weight:700;margin-bottom:1px}
#info{position:absolute;z-index:4;left:50%;top:calc(58px + env(safe-area-inset-top));transform:translateX(-50%);width:max-content;max-width:calc(100% - 24px);padding:8px 16px;background:rgba(251,248,240,.95);border:1px solid var(--line);border-radius:12px;box-shadow:0 2px 10px rgba(0,0,0,.2);font-size:16px;color:var(--ink2);text-align:center;line-height:1.3}
#info:empty{display:none}
#scene.mp ~ #info{top:calc(112px + env(safe-area-inset-top))}
#info .good{color:var(--ok);font-weight:700}
#info .ans{color:var(--red);font-weight:700}

#kb{flex:0 0 auto;padding:6px 6px calc(8px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:6px;transition:opacity .15s}
#kb.locked{opacity:.45}
.kr{display:flex;gap:5px}
.k{flex:1 1 0;min-width:0;height:44px;border-radius:7px;border:1px solid var(--keyb);background:var(--key);font-size:19px;font-weight:500;padding:0;cursor:pointer;display:flex;align-items:center;justify-content:center;touch-action:manipulation}
.k:active,.k.dn{background:#DAD2BC;transform:translateY(1px)}
.k.z{flex:0 0 calc((100% - 35px)/8);font-size:20px}
.k.bk{font-size:17px}
.k.t{height:50px;background:var(--redbg);border-color:#DDB9AE;font-size:26px}
.k.t:active,.k.t.dn{background:#E8C4B9}
.pad{flex:0 0 5%}

@media (max-height:720px){
  .k{height:40px}.k.t{height:44px}.kr{gap:4px}#kb{gap:5px;padding-top:4px}
  #ch{font-size:clamp(40px,13vw,52px)}#typed{min-height:38px}#typedTxt{font-size:26px;line-height:32px;min-height:32px}
  #hud{min-height:42px;padding-top:6px}#info{min-height:40px;font-size:15px}#qa{gap:4px;padding-top:4px}#board{padding-bottom:7px}
}
@media (max-height:600px){
  .k{height:35px;font-size:17px}.k.t{height:40px}#ch{font-size:38px}#scene{min-height:96px}#spk{width:38px;height:38px}
}
#kb.zy{gap:5px}
#kb.zy .k{height:38px}#kb.zy .k.t{height:42px}
@media (max-height:720px){#kb.zy .k{height:34px}#kb.zy .k.t{height:38px}}
@media (max-height:600px){#kb.zy .k{height:32px;font-size:16px}#kb.zy .k.t{height:36px}
  #qa{gap:2px;padding-top:2px;padding-bottom:0}#typed{min-height:30px}#typedTxt{font-size:24px;line-height:28px;min-height:28px}#board{padding-bottom:4px}}
/* ---------- 浮層 ---------- */
#ov{position:absolute;inset:0;background:rgba(244,240,230,.94);display:flex;align-items:flex-start;justify-content:center;padding:18px;z-index:5;overflow-y:auto}
.panel{margin:auto;width:min(100%,380px);background:var(--paper2);border:1px solid var(--line);border-radius:10px;padding:18px 16px;text-align:center}
.panel h2{margin:0 0 4px;font-size:24px}
.panel .btns{display:flex;flex-direction:column;gap:8px;margin-top:14px}
.stars{font-size:30px;letter-spacing:6px;color:#C9A55A;margin:6px 0 2px;line-height:1.1}
.stars .off{color:#D8D2C4}
.stats{display:flex;gap:8px;margin:12px 0 4px}
.stats div{flex:1;background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:8px 2px;font-size:12px;color:var(--ink3);line-height:1.25}
.stats b{display:block;font-size:24px;color:var(--ink);font-weight:700}
.rev{margin-top:12px;text-align:left}
.rev .lab{font-size:12px;color:var(--ink3);margin-bottom:6px}
.rev .chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:4px 8px;text-align:center;line-height:1.25}
.chip b{font-size:22px;font-weight:500;display:block}
.chip span{font-size:12px;color:var(--ink2);display:block}
.newbest{color:var(--red);font-weight:700;font-size:14px;margin-top:6px}
.bestline{font-size:12px;color:var(--ink3);margin-top:6px}
/* ---------- 暱稱、排行榜 ---------- */
.nameIn{width:100%;min-height:54px;padding:8px 14px;border-radius:8px;border:1px solid var(--keyb);background:var(--paper2);font-size:18px;font-family:inherit;color:var(--ink);-webkit-user-select:text;user-select:text}
.nameIn::placeholder{color:var(--ink3)}
.nameIn.need{border-color:var(--red);animation:shk .3s linear}
.nameHint{margin:6px 0 0;font-size:13px;color:var(--red);text-align:center}
#startBar{display:flex;flex-direction:column;align-items:stretch}
.lbBox{margin-top:12px;text-align:left}
.lbBox .lbSt{font-size:13px;color:var(--ink2);text-align:center;margin:6px 0;line-height:1.4}
.lbBox .lbSt b{color:var(--red)}
.lbNote{font-size:12px;color:var(--ink3);text-align:center;margin:0 0 8px;line-height:1.4}
.lbList{display:flex;flex-direction:column;gap:5px}
.lbRow{display:flex;align-items:center;gap:8px;padding:7px 10px;background:var(--paper);border:1px solid var(--line);border-radius:8px;font-size:15px}
.lbRow.me{background:var(--redbg);border-color:var(--red)}
.lbRank{flex:0 0 28px;text-align:center;font-size:16px;color:var(--ink2)}
.lbName{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lbVal{flex:0 0 auto;font-size:13px;color:var(--ink2);white-space:nowrap}
.lbVal b{color:var(--ink);font-size:15px}
.lbTabs{display:flex;gap:6px;margin:10px 0 8px}
.lbTabs+.lbTabs{margin-top:-2px}
.lbTabs button{flex:1;min-height:40px;border-radius:8px;border:1px solid var(--keyb);background:var(--key);font-size:14px;line-height:1.2;cursor:pointer}
.lbTabs button.on{background:var(--ink);border-color:var(--ink);color:var(--paper2)}

var AC=null;
function ac(){ if(!AC){ try{ AC=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} } if(AC&&AC.state==='suspended'){ try{AC.resume();}catch(e){} } return AC; }
function tone(f,dur,type,vol,delay){
  var a=ac(); if(!a) return; try{
    var o=a.createOscillator(),g=a.createGain(),t0=a.currentTime+(delay||0);
    o.type=type||'sine'; o.frequency.setValueAtTime(f,t0); g.gain.setValueAtTime(vol||.07,t0); g.gain.exponentialRampToValueAtTime(.0001,t0+dur);
    o.connect(g); g.connect(a.destination); o.start(t0); o.stop(t0+dur+.03);
  }catch(e){}
}
function noise(dur,vol,ftype,freq,delay){
  var a=ac(); if(!a) return; try{
    var n=Math.floor(a.sampleRate*dur), buf=a.createBuffer(1,n,a.sampleRate), d=buf.getChannelData(0);
    for(var i=0;i<n;i++) d[i]=(Math.random()*2-1)*Math.pow(1-i/n,2.2);
    var s=a.createBufferSource(), g=a.createGain(), f=a.createBiquadFilter(); f.type=ftype; f.frequency.value=freq;
    s.buffer=buf; g.gain.value=vol; s.connect(f); f.connect(g); g.connect(a.destination); s.start(a.currentTime+(delay||0));
  }catch(e){}
}
function sfx(k){
  if(k==='ok'){ tone(784,.16,'sine',.06,0); tone(1175,.26,'sine',.05,.09); }
  else if(k==='tick'){ tone(900,.05,'square',.025,0); }
  else if(k==='hit'){ noise(.12,.3,'highpass',2500,0); noise(1.1,.4,'lowpass',380,.06); tone(55,.8,'sine',.2,.08); }
  else if(k==='done'){ tone(523,.18,'sine',.06,0); tone(659,.18,'sine',.06,.14); tone(784,.18,'sine',.06,.28); tone(1047,.4,'sine',.06,.42); }
}
/* 念字：只用台灣華語（zh-TW）或 cmn 的聲音，不用粵語／香港 */
function speak(txt){
  try{
    if(!window.speechSynthesis) return;
    var vs=speechSynthesis.getVoices()||[], v=null;
    for(var i=0;i<vs.length&&!v;i++){ var l=String(vs[i].lang||'').toLowerCase().replace(/_/g,'-'); if(l==='zh-tw'||l.indexOf('cmn-tw')===0) v=vs[i]; }

    for(var m=0;m<vs.length&&!v;m++){ var l3=String(vs[m].lang||'').toLowerCase().replace(/_/g,'-'); if((l3==='zh'||l3.indexOf('zh-')===0)&&l3.indexOf('yue')<0&&l3.indexOf('hk')<0) v=vs[m]; }

/* ---------- 場景位置（整條街固定不動，人物沿著 10 階往上走）---------- */

var BGS = __BGS__, BGG = __BGG__;   // BGS[題數][場景]＝背景圖；BGG[場景]＝圖片下方鋪滿用的地面漸層

var geo={W:360,H:200,s:1,ox:0,top:0,ay:300,hC:52,wC:30,c:0};

  const rankOf = (n, strikes, secs) => (n - strikes) * 100000 + (99999 - secs);
  window.LB = {
    async top(board){
      if(!BOARDS.includes(board)) return { uid:'', list:[] };
      const uid = await ensureUid();
      const snap = await getDocs(query(collection(db, 'rayo_boards', board, 'entries'), orderBy('rank', 'desc'), limit(10)));
      return { uid, list: snap.docs.map(d => ({ uid: d.id, ...d.data() })) };
    },
    async submit(board, e){
      if(!BOARDS.includes(board)) return { saved:false };
      const name = [...String(e.name || '').trim()].slice(0, 14).join('');
      if(!name) return { saved:false };
      const n = nOf(board);
      const strikes = Math.max(0, Math.min(n, Math.round(+e.strikes) || 0));
      const secs = Math.max(Math.ceil(n * 1.5), Math.min(3600, Math.round(+e.secs) || 15));
      const uid = await ensureUid();
      const ref = doc(db, 'rayo_boards', board, 'entries', uid);
      const rank = rankOf(n, strikes, secs);
      const old = await getDoc(ref);
      if(old.exists() && (Number(old.data().rank) || 0) >= rank) return { saved:false };
      const data = { name, strikes, secs, rank, updatedAt: serverTimestamp() };
      if(e.kb === 'pinyin' || e.kb === 'zhuyin') data.kb = e.kb;
      await setDoc(ref, data);
      return { saved:true };
    }
  };
/*__MULTIFB__*/
}catch(e){ console.error('Firebase 初始化失敗', e); }
