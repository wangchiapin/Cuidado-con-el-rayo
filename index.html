<meta property="og:type" content="website">
<meta property="og:site_name" content="每天一分鐘 · Cada día unos minutos">
<meta property="og:title" content="天打雷劈｜¡Cuidado con el rayo!">
<meta property="og:description" content="看字打出拼音或注音，答對往上爬、答錯被雷劈！ · Escribe el pinyin o zhuyin, sube la escalera y ¡cuidado con el rayo!">
<meta property="og:url" content="https://wangchiapin.github.io/Cuidado-con-el-rayo/">

<meta name="theme-color" content="#F4F0E6">
<style>
:root{
  --paper:#F4F0E6; --paper2:#FBF8F0; --key:#EAE3D2; --keyb:#CFC7B2; --ink:#3B3B38; --ink2:#6E6A5E; --ink3:#8A8678;
  --red:#B5584A; --redbg:#F1DAD3; --line:#D8D2C4; --ok:#5E7F5A;
  --font:"Noto Sans TC","PingFang TC","Microsoft JhengHei","Heiti TC",system-ui,-apple-system,"Segoe UI",sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;background:var(--paper);color:var(--ink);font-family:var(--font);overscroll-behavior:none;touch-action:manipulation;-webkit-user-select:none;user-select:none}
button{font-family:inherit;color:inherit}
#app{height:100vh;height:100dvh;max-width:520px;margin:0 auto;display:flex;flex-direction:column;position:relative;overflow:hidden}
.screen{flex:1;display:flex;flex-direction:column;min-height:0}
[hidden]{display:none!important}
.tl{display:block;font-size:.72em;color:var(--ink3);font-weight:400;line-height:1.2;margin-top:1px}

/* ---------- 首頁 ---------- */
#start{overflow-y:auto;-webkit-overflow-scrolling:touch}
#start .inner{flex:1 0 auto;padding:16px 18px 8px;display:flex;flex-direction:column;align-items:center;justify-content:flex-start}
#heroWrap{position:relative;width:100%;aspect-ratio:360/290;background:var(--paper2);border:1px solid var(--line);border-radius:8px;margin-top:6px;overflow:hidden}
#start .inner h1{margin-top:0}
#start .inner .nameIn{margin-top:12px;text-align:center}
#start .inner #segGender{align-self:stretch;margin-top:10px}
@media(max-width:560px){#start .inner{padding-top:16px}}
/* 手機版首頁：標題放大、圖片吃掉中間剩下的空間（最高到寬度的 1.02 倍，人物不要比階梯大太多），名字欄加高 */
@media(max-width:699px){
  #start h1{font-size:38px}
  #start .sub{font-size:16px}
  #heroWrap{aspect-ratio:auto;flex:1 1 auto;min-height:calc((100vw - 36px)*.6);max-height:calc((100vw - 36px)*1.02)}
  #heroChar{height:min(52%,calc((100vw - 36px)*.5))}
  #start .inner .nameIn{min-height:58px;font-size:19px}
}
/* 電腦版首頁：欄放寬、標題放大；圖片高度算到剛好整頁不用捲動（--hh），名字欄、男女選項跟圖片同寬，開始鈕不要太寬 */
@media(min-width:700px){
  #app:has(#start:not([hidden])){max-width:820px}
  #start{--hh:clamp(210px,calc(100dvh - 465px),560px);--hw:calc(var(--hh)*1.24)}
  #start .inner{padding-top:20px;padding-bottom:0;flex:0 0 auto}   /* 電腦版：開始鈕緊接在男生／女生下面，不貼到視窗最底 */
  #start h1{font-size:46px;margin-top:4px}
  #start .sub{font-size:18px;margin:4px 0 6px}
  #heroWrap{aspect-ratio:auto;flex:none;height:var(--hh);width:var(--hw);margin:6px auto 0}
  #start .inner .nameIn{width:var(--hw);margin-left:auto;margin-right:auto;min-height:56px;font-size:20px}
  #start .inner #segGender{align-self:center;width:var(--hw)}
  #startBar{display:flex;justify-content:center;padding-top:2px;margin-top:8px}
  #start #startBar .big{width:340px;align-self:center}
}
/* 矮視窗（電腦視窗不高、小手機）：標題縮小、拿掉副標的西文行，讓整頁還是不用捲動 */
@media(min-width:700px) and (max-height:680px){
  #start{--hh:clamp(170px,calc(100dvh - 440px),560px)}
  #start h1{font-size:36px}
  #start .sub{margin:2px 0 4px;font-size:16px}
  #start .sub .tl{display:none}
}
@media(max-width:699px) and (max-height:620px){
  #start h1{font-size:32px}
  #start .sub{margin:2px 0 6px;font-size:14px}
  #start .sub .tl{display:none}
  #heroWrap{min-height:calc((100vw - 36px)*.42)}
  #start .inner .nameIn{min-height:50px}
}
/* 街景只畫一次：整張當成背景圖（手機不用一直重畫上百個向量圖形，避免 iPhone 記憶體不夠、整頁被系統重開） */
.streetBg{background-repeat:no-repeat;background-position:50% 85%;background-size:cover}
#heroWrap>.streetBg{position:absolute;inset:0;background-position:50% 0,0 0;background-size:100% auto,100% 100%}
#heroWrap .clouds{position:absolute;left:0;right:0;top:-8px;height:34%;opacity:.7}
#heroWrap .clouds svg{width:100%;height:100%;display:block}
#heroChar{position:absolute;left:0;right:0;bottom:3%;height:52%;display:flex;justify-content:center}
#heroChar svg{height:100%;width:auto}
h1{font-size:30px;margin:14px 0 2px;font-weight:700;letter-spacing:.08em;text-align:center}
h1 .bolt{display:inline-block;height:1.15em;width:auto;vertical-align:-.2em;margin-right:.1em;transform:rotate(8deg)}
h1 .zapman{display:inline-block;height:1.15em;width:auto;vertical-align:-.2em;margin-left:.1em}
h1 .tl{font-size:.46em;letter-spacing:0;margin-top:3px}
.sub{font-size:14px;color:var(--ink2);text-align:center;margin:6px 0 10px;line-height:1.5}
.how{align-self:stretch;margin:0 0 6px;padding:10px 12px;background:var(--paper2);border:1px solid var(--line);border-radius:8px;font-size:13px;line-height:1.45;color:var(--ink2)}
.how div+div{margin-top:6px}
.how .tl{font-size:.9em}
.grp{align-self:stretch;margin-top:10px}
.grp .lab{font-size:12px;color:var(--ink3);margin:0 0 5px 2px}
.seg{display:flex;gap:6px}
.seg button{flex:1;min-height:44px;padding:6px 4px;border-radius:8px;border:1px solid var(--keyb);background:var(--key);font-size:15px;line-height:1.2;cursor:pointer}
.seg button.on{background:var(--ink);border-color:var(--ink);color:var(--paper2)}
.seg button.on .tl{color:#D8D2C4}
#startBar{position:sticky;bottom:0;padding:10px 18px calc(12px + env(safe-area-inset-bottom));background:var(--paper);margin-top:14px;z-index:2}
.big{width:100%;min-height:54px;border-radius:10px;border:0;background:var(--red);color:#fff;font-size:20px;font-weight:700;letter-spacing:.2em;cursor:pointer}
.big .tl{color:#F5DDD6;letter-spacing:0;font-size:.6em}
.big:active{transform:scale(.985)}
.ghost{min-height:46px;padding:8px 14px;border-radius:10px;border:1px solid var(--keyb);background:var(--key);font-size:16px;cursor:pointer}

/* ---------- 遊戲畫面 ---------- */
#hud{position:relative;z-index:4;flex:0 0 auto;display:flex;align-items:center;gap:14px;padding:8px 58px 4px 14px;min-height:46px;background:linear-gradient(rgba(244,240,230,.92),rgba(244,240,230,.6) 70%,rgba(244,240,230,0))}
.stat{font-size:12px;color:var(--ink2);line-height:1.15;white-space:nowrap}
.stat b{font-size:17px;color:var(--ink);font-weight:700}
#stStrike b{color:var(--red)}
#hud .sp{flex:1}
#btnPause{width:40px;height:40px;border-radius:50%;border:1px solid var(--keyb);background:var(--key);font-size:15px;line-height:1;cursor:pointer;padding:0}

#scene{position:absolute;inset:0;background:#CDBFA8;overflow:hidden;--storm:0}
#world{position:absolute;left:50%;top:0;pointer-events:none;background-repeat:no-repeat;background-position:0 0,0 0;background-size:100% auto,100% 100%;will-change:transform}
#world.mv{transition:transform .75s cubic-bezier(.4,.1,.25,1)}
#world::after{content:'';position:absolute;left:0;right:0;top:var(--ih,100%);bottom:0;background:linear-gradient(rgba(42,36,32,0),rgba(42,36,32,.55) 60%)}   /* 圖片下面鋪滿的地面，越下面越暗 */
#player{position:absolute;left:0;top:0;pointer-events:none;transform-origin:50% 95.6%}
#player.mv{transition:transform .75s cubic-bezier(.4,.1,.25,1)}
#player svg{height:100%;width:100%;display:block;transform-origin:50% 100%}
#player.hop svg{animation:hop .4s ease-out}
#player.zap svg{animation:zap .6s linear forwards}
#player.hit svg{transform:rotate(24deg) translateX(2px)}
#world.zin,#player.zin{transition:scale .9s cubic-bezier(.45,.05,.25,1),translate .9s cubic-bezier(.45,.05,.25,1),transform .75s cubic-bezier(.4,.1,.25,1)}
#player.tired svg{animation:pant .55s ease-in-out infinite;overflow:visible;transform-origin:50% 100%}
@keyframes pant{0%,100%{transform:scale(1.03,.9) rotate(2deg)}50%{transform:scale(1.06,.87) rotate(-2deg)}}
#player.tired .mn{display:none}#player.tired .mx{display:inline}
#player.tired .al{transform:rotate(-26deg);transform-origin:12.5px 40px}#player.tired .ar{transform:rotate(26deg);transform-origin:47.5px 40px}
#player .pf{position:absolute;pointer-events:none;font-weight:700;color:#fff;text-shadow:0 0 3px #4A4F52,0 0 3px #4A4F52,0 1px 3px rgba(0,0,0,.5);font-size:calc(var(--pw,30px)*.42);animation:puff 1.1s ease-out infinite;opacity:0}
@keyframes puff{0%{opacity:0;transform:translate(0,0) scale(.7)}25%{opacity:1}100%{opacity:0;transform:translate(var(--px,14px),-14px) scale(1.15)}}
#player .sw{position:absolute;width:calc(var(--pw,30px)*.1);height:calc(var(--pw,30px)*.15);background:#8EC3E6;border:1px solid #5E86B8;border-radius:50% 50% 50% 50%/65% 65% 38% 38%;animation:sweat .9s ease-in infinite;opacity:0}
@keyframes sweat{0%{opacity:0;transform:translateY(0)}20%{opacity:1}100%{opacity:0;transform:translateY(calc(var(--pw,30px)*.4))}}
#player.cheer svg{animation:cheer .6s ease-out 5;overflow:visible}
#player.cheer .al,#player.cheer .ar{animation-duration:.6s;animation-iteration-count:5;animation-timing-function:ease-in-out}
#player.cheer .al{transform-origin:12.5px 40px;animation-name:armL}
#player.cheer .ar{transform-origin:47.5px 40px;animation-name:armR}
@keyframes armL{0%{transform:rotate(55deg)}40%{transform:rotate(160deg)}75%{transform:rotate(150deg)}100%{transform:rotate(55deg)}}
@keyframes armR{0%{transform:rotate(-55deg)}40%{transform:rotate(-160deg)}75%{transform:rotate(-150deg)}100%{transform:rotate(-55deg)}}
@keyframes cheer{0%{transform:translateY(0) scale(1,1)}14%{transform:translateY(0) scale(1.1,.88)}46%{transform:translateY(-48%) scale(.94,1.08) rotate(-5deg)}78%{transform:translateY(0) scale(1.08,.92) rotate(3deg)}100%{transform:translateY(0) scale(1,1)}}
.cf{position:absolute;top:-16px;width:8px;height:12px;border-radius:2px;animation:cfall var(--d) linear forwards}
@keyframes cfall{from{transform:translate(0,0) rotate(0);opacity:1}85%{opacity:1}to{transform:translate(var(--dx),calc(100vh + 40px)) rotate(var(--rot));opacity:.9}}
.topTxt{position:absolute;left:0;right:0;top:9%;text-align:center;font-size:46px;font-weight:700;letter-spacing:.1em;color:#fff;text-shadow:0 2px 0 #B5584A,0 0 14px rgba(217,164,65,.9),0 3px 10px rgba(0,0,0,.35);animation:topPop .5s cubic-bezier(.3,1.6,.5,1) both}
.topTxt .tl{display:block;font-size:.38em;letter-spacing:0;margin-top:2px;color:#fff;font-weight:600}
@keyframes topPop{from{transform:scale(.2);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes hop{0%{transform:translateY(0)}40%{transform:translateY(-12px)}100%{transform:translateY(0)}}
@keyframes zap{0%{transform:translateX(0)}12%{transform:translateX(-3px)}24%{transform:translateX(3px)}36%{transform:translateX(-2px)}48%{transform:translateX(2px)}100%{transform:rotate(24deg) translateX(2px)}}
.ex,.mx,.soot{display:none}
.hit .en,.hit .mn{display:none}
.hit .ex,.hit .mx{display:inline}
.hit .soot{display:inline}
#veil{position:absolute;inset:0;background:#2E3542;opacity:calc(var(--storm) * .3);pointer-events:none;transition:opacity .5s}
#clouds{position:absolute;left:-6%;right:-6%;top:-12px;height:60px;pointer-events:none;opacity:calc(.5 + var(--storm) * .5);transition:opacity .5s}
#clouds svg{width:100%;height:100%;display:block;animation:drift 14s ease-in-out infinite alternate}
@keyframes drift{from{transform:translateX(-3%)}to{transform:translateX(3%)}}
#bolt{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;opacity:0;filter:drop-shadow(0 0 5px #FFF3B0)}
#bolt.on{animation:bolt .65s linear}
@keyframes bolt{0%{opacity:0}6%{opacity:1}38%{opacity:1}48%{opacity:.55}58%{opacity:1}100%{opacity:0}}
#fx{position:absolute;inset:0;pointer-events:none}
.sp1{position:absolute;width:7px;height:7px;border-radius:50%;animation:spark .6s ease-out forwards}
@keyframes spark{from{transform:translate(0,0) scale(1);opacity:1}to{transform:translate(var(--dx),var(--dy)) scale(.3);opacity:0}}
#flash{position:absolute;inset:0;background:#FFFBEA;opacity:0;pointer-events:none}
#flash.on{animation:fl .55s ease-out}
@keyframes fl{from{opacity:.55}to{opacity:0}}
#scene.shake{animation:shk .3s linear}
@keyframes shk{0%,100%{transform:translateX(0)}20%{transform:translateX(-5px)}40%{transform:translateX(5px)}60%{transform:translateX(-3px)}80%{transform:translateX(3px)}}

#sheet{position:absolute;left:0;right:0;bottom:0;z-index:3;display:flex;flex-direction:column;background:rgba(244,240,230,.97);border-radius:18px 18px 0 0;box-shadow:0 -8px 22px rgba(0,0,0,.22);transform:translateY(106%);transition:transform .28s ease;pointer-events:none}
#play.sheetUp #sheet{transform:none;pointer-events:auto}
#qa{flex:0 0 auto;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding:12px 12px 6px;gap:6px}
#board{position:relative;align-self:stretch;margin:0 4px;display:flex;align-items:center;justify-content:center;gap:14px;padding:2px 0 8px;background:var(--paper2);border:1px solid var(--line);border-radius:10px;overflow:hidden}
#ch{font-size:clamp(44px,min(17vw,9dvh),72px);line-height:1.08;font-weight:500}
#spk{width:44px;height:44px;border-radius:50%;border:1px solid var(--keyb);background:var(--key);font-size:19px;cursor:pointer;padding:0}
#timer{position:absolute;left:0;right:0;bottom:0;height:5px;background:#E6E0D0}
#timerBar{display:block;height:100%;width:100%;background:var(--ink);transform-origin:0 50%}
#timer.low #timerBar{background:var(--red)}
#typed{align-self:stretch;margin:0 6px;min-height:44px;display:flex;align-items:center;justify-content:center;border-bottom:2px solid var(--ink)}
#typedTxt{flex:1;font-size:28px;font-weight:500;letter-spacing:.06em;min-width:40px;text-align:center;min-height:36px;line-height:36px}
#typedTxt b{color:var(--red);font-weight:700;margin-left:2px}
#typedTxt.bad{color:var(--red);animation:shk .28s linear}
#typedTxt.done{color:var(--ink2)}
.kbsw{display:flex;border:1px solid var(--keyb);border-radius:8px;overflow:hidden}
.kbsw button{width:34px;height:36px;border:0;background:var(--key);font-size:15px;padding:0;cursor:pointer}
.kbsw button.on{background:var(--ink);color:var(--paper2)}
#info .tag{font-size:14px;color:var(--red);font-weight:700;margin-bottom:1px}
#info{position:absolute;z-index:4;left:50%;top:calc(58px + env(safe-area-inset-top));transform:translateX(-50%);width:max-content;max-width:calc(100% - 24px);padding:8px 16px;background:rgba(251,248,240,.95);border:1px solid var(--line);border-radius:12px;box-shadow:0 2px 10px rgba(0,0,0,.2);font-size:16px;color:var(--ink2);text-align:center;line-height:1.3}
#info:empty{display:none}
#scene.mp ~ #info{top:calc(112px + env(safe-area-inset-top))}
#info .good{color:var(--ok);font-weight:700}
#info .ans{color:var(--red);font-weight:700}

#kb{flex:0 0 auto;padding:6px 6px calc(8px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:6px;transition:opacity .15s}
#kb.locked{opacity:.45}
.kr{display:flex;gap:5px}
.k{flex:1 1 0;min-width:0;height:44px;border-radius:7px;border:1px solid var(--keyb);background:var(--key);font-size:19px;font-weight:500;padding:0;cursor:pointer;display:flex;align-items:center;justify-content:center;touch-action:manipulation}
.k:active,.k.dn{background:#DAD2BC;transform:translateY(1px)}
.k.z{flex:0 0 calc((100% - 35px)/8);font-size:20px}
.k.bk{font-size:17px}
.k.t{height:50px;background:var(--redbg);border-color:#DDB9AE;font-size:26px}
.k.t:active,.k.t.dn{background:#E8C4B9}
.pad{flex:0 0 5%}

@media (max-height:720px){
  .k{height:40px}.k.t{height:44px}.kr{gap:4px}#kb{gap:5px;padding-top:4px}
  #ch{font-size:clamp(40px,13vw,52px)}#typed{min-height:38px}#typedTxt{font-size:26px;line-height:32px;min-height:32px}
  #hud{min-height:42px;padding-top:6px}#info{min-height:40px;font-size:15px}#qa{gap:4px;padding-top:4px}#board{padding-bottom:7px}
}
@media (max-height:600px){
  .k{height:35px;font-size:17px}.k.t{height:40px}#ch{font-size:38px}#scene{min-height:96px}#spk{width:38px;height:38px}
}
#kb.zy{gap:5px}
#kb.zy .k{height:38px}#kb.zy .k.t{height:42px}
@media (max-height:720px){#kb.zy .k{height:34px}#kb.zy .k.t{height:38px}}
@media (max-height:600px){#kb.zy .k{height:32px;font-size:16px}#kb.zy .k.t{height:36px}
  #qa{gap:2px;padding-top:2px;padding-bottom:0}#typed{min-height:30px}#typedTxt{font-size:24px;line-height:28px;min-height:28px}#board{padding-bottom:4px}}
/* ---------- 浮層 ---------- */
#ov{position:absolute;inset:0;background:rgba(244,240,230,.94);display:flex;align-items:flex-start;justify-content:center;padding:18px;z-index:5;overflow-y:auto}
.panel{margin:auto;width:min(100%,380px);background:var(--paper2);border:1px solid var(--line);border-radius:10px;padding:18px 16px;text-align:center}
.panel h2{margin:0 0 4px;font-size:24px}
.panel .btns{display:flex;flex-direction:column;gap:8px;margin-top:14px}
.stars{font-size:30px;letter-spacing:6px;color:#C9A55A;margin:6px 0 2px;line-height:1.1}
.stars .off{color:#D8D2C4}
.stats{display:flex;gap:8px;margin:12px 0 4px}
.stats div{flex:1;background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:8px 2px;font-size:12px;color:var(--ink3);line-height:1.25}
.stats b{display:block;font-size:24px;color:var(--ink);font-weight:700}
.rev{margin-top:12px;text-align:left}
.rev .lab{font-size:12px;color:var(--ink3);margin-bottom:6px}
.rev .chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:4px 8px;text-align:center;line-height:1.25}
.chip b{font-size:22px;font-weight:500;display:block}
.chip span{font-size:12px;color:var(--ink2);display:block}
.newbest{color:var(--red);font-weight:700;font-size:14px;margin-top:6px}
.bestline{font-size:12px;color:var(--ink3);margin-top:6px}
/* ---------- 暱稱、排行榜 ---------- */
.nameIn{width:100%;min-height:54px;padding:8px 14px;border-radius:8px;border:1px solid var(--keyb);background:var(--paper2);font-size:18px;font-family:inherit;color:var(--ink);-webkit-user-select:text;user-select:text}
.nameIn::placeholder{color:var(--ink3)}
.nameIn.need{border-color:var(--red);animation:shk .3s linear}
.nameHint{margin:6px 0 0;font-size:13px;color:var(--red);text-align:center}
#startBar{display:flex;flex-direction:column;align-items:stretch}
.lbBox{margin-top:12px;text-align:left}
.lbBox .lbSt{font-size:13px;color:var(--ink2);text-align:center;margin:6px 0;line-height:1.4}
.lbBox .lbSt b{color:var(--red)}
.lbNote{font-size:12px;color:var(--ink3);text-align:center;margin:0 0 8px;line-height:1.4}
.lbList{display:flex;flex-direction:column;gap:5px}
.lbRow{display:flex;align-items:center;gap:8px;padding:7px 10px;background:var(--paper);border:1px solid var(--line);border-radius:8px;font-size:15px}
.lbRow.me{background:var(--redbg);border-color:var(--red)}
.lbRank{flex:0 0 28px;text-align:center;font-size:16px;color:var(--ink2)}
.lbName{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lbVal{flex:0 0 auto;font-size:13px;color:var(--ink2);white-space:nowrap}
.lbVal b{color:var(--ink);font-size:15px}
.lbTabs{display:flex;gap:6px;margin:10px 0 8px}
.lbTabs+.lbTabs{margin-top:-2px}
.lbTabs button{flex:1;min-height:40px;border-radius:8px;border:1px solid var(--keyb);background:var(--key);font-size:14px;line-height:1.2;cursor:pointer}
.lbTabs button.on{background:var(--ink);border-color:var(--ink);color:var(--paper2)}
.lbAsk{display:flex;gap:6px;margin-top:6px}
.lbAsk .nameIn{flex:1}
.lbAsk .ghost{flex:0 0 auto}

/* ---------- 連線 ---------- */
.mpBox{margin-top:12px;padding:10px;background:var(--paper);border:1px solid var(--line);border-radius:8px;text-align:left}
.mpBox h3{margin:0 0 8px;font-size:14px;color:var(--ink2);font-weight:600}
.mpBox .btns{margin-top:10px}
.mpChk{display:flex;align-items:center;gap:8px;margin-top:8px;font-size:14px;color:var(--ink2)}
.mpChk input{width:18px;height:18px}
.mpP{padding:12px 14px}
.mpP h2{margin:0 0 2px;font-size:21px}
.mpP h2 .tl{display:inline;margin-left:8px;font-size:13px}
.mpP .lbNote{margin:0 0 4px;font-size:12px}
.mpP .grp{margin-top:6px}
.mpP .grp .lab{margin-bottom:3px}
.mpP .nameIn{min-height:46px;font-size:17px}
.mpP .mpBox{margin-top:8px;padding:8px 10px}
.mpP .mpBox h3{margin:0 0 6px}
.mpP .seg button{min-height:40px;padding:4px}
.mpP .big{min-height:46px;font-size:18px}
.mpP .mpBox .btns{margin-top:8px}
.mpP .mpRow{display:flex;gap:8px;align-items:stretch}
.mpP .mpRow .nameIn{flex:1;min-width:0}
.mpP .mpRow .big{flex:0 0 36%;width:auto}
.mpP .mpChk{margin-top:6px}
.mpP .lbSt{min-height:0;margin:4px 0}
.mpP .ghost{min-height:42px;padding:4px 14px}
.mpP>.btns{margin-top:6px}
.codeBig{font-size:46px;font-weight:700;letter-spacing:.2em;margin:2px 0 8px;padding-left:.2em}
.lab{font-size:12px;color:var(--ink3)}
.plList{display:flex;flex-direction:column;gap:4px;max-height:34vh;overflow-y:auto}
.plRow{display:flex;align-items:center;gap:8px;padding:3px 8px;background:var(--paper);border:1px solid var(--line);border-radius:8px;font-size:15px}
.plRow.me{background:var(--redbg);border-color:var(--red)}
.plFig{flex:0 0 22px;height:34px;display:block}
.plFig svg{width:100%;height:100%;display:block}
.plTag{flex:0 0 auto;font-size:11px;padding:1px 6px;border-radius:9px;background:var(--ink);color:var(--paper2)}
.plTag.w{background:var(--keyb);color:var(--ink)}
#crowd{position:absolute;inset:0;pointer-events:none}
#scene.mp #player{display:none}
.fig{position:absolute;left:0;top:0;transform-origin:50% 95.6%}
.fig.mv{transition:transform .75s cubic-bezier(.4,.1,.25,1)}
.fig svg{display:block;width:100%;height:100%;transform-origin:50% 100%}
.fig.hop svg{animation:hop .4s ease-out}
.fig.zap svg{animation:zap .6s linear forwards}
.fig.hit svg{transform:rotate(24deg) translateX(2px)}
.fig.hit:nth-child(even) svg{transform:rotate(-24deg) translateX(-2px)}
.fig .nm{position:absolute;left:50%;bottom:100%;transform:translateX(-50%);white-space:nowrap;font-size:var(--nf,10px);line-height:1;color:var(--ink);background:rgba(251,248,240,.85);padding:1px 3px;border-radius:3px;margin-bottom:1px}
.fig.me .nm{background:var(--red);color:#fff;font-weight:700}
.fig.out .nm{color:var(--ink3)}
.fig.out{opacity:.85}
#mpStrip{position:absolute;z-index:4;left:0;right:0;top:calc(48px + env(safe-area-inset-top));display:flex;flex-wrap:wrap;gap:3px;padding:3px 10px 0}
#mpStrip .sc{max-width:64px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:10px;line-height:1.5;padding:0 5px;border-radius:9px;background:var(--key);color:var(--ink2)}
#mpStrip .sc.me{background:var(--red);color:#fff}
#mpStrip .sc.out{background:transparent;color:var(--ink3);text-decoration:line-through}
#info .wt{color:var(--ink2)}

/* ---------- 首頁右上角：設定、說明 ---------- */
#iconRow{display:flex;justify-content:center;gap:12px;margin-top:10px}
#iconRow .ib{width:44px;height:44px}
/* 首頁的 🔊 放在底下那排；遊戲裡的 🔊 還是在右上角。首頁上有視窗（排行榜、連線）時，右上角的 🔊 照常顯示 */
#app:has(#start:not([hidden])):has(#ov[hidden]) ~ #hgMute{display:none}
.ib{width:40px;height:40px;border-radius:50%;border:1px solid rgba(0,0,0,.28);background:rgba(255,255,255,.88);color:#222;font-size:19px;line-height:1;padding:0;cursor:pointer;box-shadow:0 1px 4px rgba(0,0,0,.25)}
.ib:active{transform:scale(.94)}
.ib.sq{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;line-height:1;border-radius:10px;background:var(--key);border:1px solid var(--keyb);box-shadow:none;font-size:13px;font-weight:600;color:var(--ink);letter-spacing:0}
#btnLb{font-size:19px}
#btnMulti .ic{font-size:17px}
#btnMulti .lb{font-size:10px;font-weight:600}
.setPanel{text-align:left}
.setPanel h2{text-align:center}
.setPanel .how{margin-top:0}
</style>
</head>

function waitLB(){
  return new Promise(function(res){
    var n=0; (function chk(){ if(window.LB) return res(window.LB); if(++n>50) return res(null); setTimeout(chk,100); })();
  });
}

function lbTable(list,myUid){
  if(!list.length) return '<p class="lbSt">'+plain('lbEmpty')+'</p>';
  var medals=['🥇','🥈','🥉'];
  return '<div class="lbList">'+list.map(function(e,i){

function lbAfterGame(strikes,secs,gid){
  var area=$('lbArea'); if(!area) return;
  var board=boardId(cfg.lv,NSTEP), kb=cfg.kb;
  var here=function(){ return gid===S.gid && $('lbArea')===area; };
  function show(note){
    return waitLB().then(function(lb){
      if(!lb) throw 0;
      return lb.top(board).then(function(top){
        if(!here()) return;
        area.innerHTML=(note?'<p class="lbSt"><b>'+note+'</b></p>':'')+lbTable(top.list,top.uid);
      });
    });
  }
  function fail(){ if(here()) area.innerHTML='<p class="lbSt">'+plain('lbError')+'</p>'; }
  function submit(){
    area.innerHTML='<p class="lbSt">'+plain('lbLoading')+'</p>';
    waitLB().then(function(lb){
      if(!lb) throw 0;
      return lb.submit(board,{name:getName(),strikes:strikes,secs:secs,kb:kb}).then(function(r){
        return show(plain(r.saved?'lbNew':'lbNotBetter'));
      });

}

/* 電腦鍵盤：拼音模式打字母，1–4 當聲調（空白＝一聲）；注音模式用標準注音鍵位 */
var ZYMAP={'1':'ㄅ','q':'ㄆ','a':'ㄇ','z':'ㄈ','2':'ㄉ','w':'ㄊ','s':'ㄋ','x':'ㄌ','e':'ㄍ','d':'ㄎ','c':'ㄏ','r':'ㄐ','f':'ㄑ','v':'ㄒ','5':'ㄓ','t':'ㄔ','g':'ㄕ','b':'ㄖ','y':'ㄗ','h':'ㄘ','n':'ㄙ','u':'ㄧ','j':'ㄨ','m':'ㄩ','8':'ㄚ','i':'ㄛ','k':'ㄜ',',':'ㄝ','9':'ㄞ','o':'ㄟ','l':'ㄠ','.':'ㄡ','0':'ㄢ','p':'ㄣ',';':'ㄤ','/':'ㄥ','-':'ㄦ'};
var CODECH={Comma:',',Period:'.',Semicolon:';',Slash:'/',Minus:'-',Space:' ',Enter:' ',NumpadEnter:' ',NumpadSubtract:'-',NumpadDecimal:'.'};
function keyChar(e){   // 先看實體鍵位（開著中文輸入法也一樣），沒有才看 e.key
  var c=e.code||'', m;
  if((m=/^Key([A-Z])$/.exec(c))) return m[1].toLowerCase();
  if((m=/^(?:Digit|Numpad)([0-9])$/.exec(c))) return m[1];
  if(CODECH[c]) return CODECH[c];
  var k=e.key; return (k&&k.length===1)?k.toLowerCase():(k==='Backspace'?'Backspace':'');
}
function flashKey(v){
  var b=document.querySelector('#kb .k[data-k="'+v+'"]'); if(!b) return;
  b.classList.add('dn'); setTimeout(function(){ b.classList.remove('dn'); },120);
}
document.addEventListener('keydown',function(e){
  if(!S.running||S.paused||S.over||e.ctrlKey||e.metaKey||e.altKey) return;
  var ch=keyChar(e), v=null;
  if(ch==='Backspace'||e.code==='Backspace') v='BK';
  else if(cfg.kb==='pinyin'){
    if(/^[a-z]$/.test(ch)) v=ch;
    else if(/^[1-4]$/.test(ch)) v='T'+ch;
    else if(ch==='5'||ch==='0') v='T5';
    else if(ch===' ') v='T1';
  }else{
    if(ch==='3') v='T3'; else if(ch==='4') v='T4'; else if(ch==='7') v='T5'; else if(ch==='6') v='T2'; else if(ch===' ') v='T1';
    else if(ZYMAP[ch]) v=ZYMAP[ch];
  }
  if(!v) return;
  e.preventDefault();

/* ---------- 聲音 ---------- */
var AC=null;

}
function noise(dur,vol,ftype,freq,delay){

    var n=Math.floor(a.sampleRate*dur), buf=a.createBuffer(1,n,a.sampleRate), d=buf.getChannelData(0);

}

  else if(k==='tick'){ tone(900,.05,'square',.025,0); }
  else if(k==='hit'){ bgDuck(.1,1.3); noise(.12,.3,'highpass',2500,0); noise(1.1,.4,'lowpass',380,.06); tone(55,.8,'sine',.2,.08); }
  else if(k==='done'){ bgDuck(.35,1.0); tone(523,.18,'sine',.06,0); tone(659,.18,'sine',.06,.14); tone(784,.18,'sine',.06,.28); tone(1047,.4,'sine',.06,.42); }
}
/* ---------- 背景音樂（用 Web Audio 現場合成，明快的五聲音階小調；閃電時會自動壓低，不跟雷聲打架）---------- */
var BG={on:false,step:0,next:0,duck:null,fade:null};
var BG_MEL=[76,0,79,76,72,0,76,79, 74,0,79,74,71,0,74,79, 76,0,81,76,72,0,76,81, 72,0,77,72,69,0,72,77,
            79,0,76,79,84,0,83,79, 79,0,74,79,83,0,81,79, 81,0,77,81,84,0,81,77, 79,0,74,79,83,0,81,0];   // 明亮的大調（C–G–Am–F 那種流行小品），不用五聲音階
var BG_BASS=[48,55,57,53,48,55,53,55];                                         // 每小節的低音（根音；第 3 拍換五度）
var BG_CH=[[60,64,67],[59,62,67],[60,64,69],[60,65,69],[60,64,67],[59,62,67],[60,65,69],[59,62,67]];   // 每小節的和弦（反拍輕輕點一下）

  var a=ac(); if(!a) return null;

  return a;
}
function bgPluck(f,t0,dur,type,vol){

}
function bgStep(st,t0){
  var bar=Math.floor(st/8), i=st%8, m=BG_MEL[st];
  if(m){ bgPluck(mf(m),t0,.3,'triangle',.05); bgPluck(mf(m+12),t0,.16,'sine',.012); }
  if(i===0) bgPluck(mf(BG_BASS[bar]),t0,.34,'triangle',.06);
  if(i===4) bgPluck(mf(BG_BASS[bar]+7),t0,.3,'triangle',.05);
  if(i===2||i===6) BG_CH[bar].forEach(function(n){ bgPluck(mf(n),t0,.13,'triangle',.017); });   // 反拍的和弦點點，輕快的跳動感
}

function bgWant(){ return !!S.running && !S.over && !S.paused && !document.hidden && !$('play').hidden && $('ov').hidden; }
setInterval(function(){
  var want=bgWant(), a;

function speak(txt){

    if(!window.speechSynthesis) return;
    var vs=speechSynthesis.getVoices()||[], v=null;
    for(var i=0;i<vs.length&&!v;i++){ var l=String(vs[i].lang||'').toLowerCase().replace(/_/g,'-'); if(l==='zh-tw'||l.indexOf('cmn-tw')===0) v=vs[i]; }
    for(var j=0;j<vs.length&&!v;j++){ var l2=String(vs[j].lang||'').toLowerCase().replace(/_/g,'-'); if(l2.indexOf('cmn')===0) v=vs[j]; }
    for(var m=0;m<vs.length&&!v;m++){ var l3=String(vs[m].lang||'').toLowerCase().replace(/_/g,'-'); if((l3==='zh'||l3.indexOf('zh-')===0)&&l3.indexOf('yue')<0&&l3.indexOf('hk')<0) v=vs[m]; }

}

function readingText(code){

/* ---------- 打字送出（按聲調鍵＝送出，送出後不能改）---------- */
function keyPress(k){
  if(!S.running||S.paused||S.over||S.phase!=='ask'||S.locked) return;
  ac();
  if(k==='BK'){ S.buf=S.buf.slice(0,-1); renderTyped(); return; }
  if(/^T[1-5]$/.test(k)){ submit(+k.charAt(1)); return; }
  if(S.buf.length < (cfg.kb==='pinyin'?6:4)){ S.buf+=k; renderTyped(); }
}
function submit(tn){
  if(!S.buf){ setInfo(plain('empty')); return; }
  S.locked=true;
  var q=S.q, hit=null;
  if(cfg.kb==='pinyin'){ var code=S.buf+tn; if(q.r.indexOf(code)>=0) hit=code; }
  else { var z=(tn===5?'˙':'')+S.buf+TONEMARK[tn]; for(var i=0;i<q.r.length;i++){ if(LABELS[q.r[i]][1]===z){ hit=q.r[i]; break; } } }
  renderTyped(tn);
  if(MP.on){ mpSubmitted(!!hit); return; }
  reveal(!!hit,hit,false);
}

function chText(q){ return Settings.script==='simp'?(q.s||q.c):q.c; }

  var q=S.q; S.phase='reveal'; S.phaseT = ok?1.2:2.6;

  return S.phase==='ask';
}

  if(!S.running) return;

  if(!S.paused && !S.over){
    dt*=S.timeScale;
    if(S.phase==='ask'){
      if(!S.locked){
        S.tLeft-=dt;
        var sec=Math.ceil(Math.max(0,S.tLeft));
        if(sec!==S.lastSec){ S.lastSec=sec; if(sec>0&&sec<=3) sfx('tick'); }
        if(S.tLeft<=0) timeUp(); else { renderTimer(); setStorm(Math.pow(1-S.tLeft/S.T,1.6)); }
      }
    }else{
      S.phaseT-=dt;
      if(S.phase==='end' && !S.cheered && S.phaseT<=CHEER_T){ S.cheered=true; startCheer(); }   // 走到頂（約 0.8 秒）之後才開始慶祝
      if(S.phaseT<=0) advance();

  }
  requestAnimationFrame(tick);
}

/* ====================== 連線模式（最多 15 人，一條命）======================

function mpBuildFigs(){

    d.innerHTML='<span class="nm">'+esc(mpShort(p.name,N>8?3:4))+'</span>'+(CHARS[p.g]&&CHARS[p.g][p.ci]||'');
    c.appendChild(d); MP.figs[u]=d;
  });

}
function mpStrip(){
  var e=mpElim(), s=$('mpStrip'); s.innerHTML=mpRoster().map(function(u){
    var p=MP.pl[u]||{name:'?'};
    return '<span class="sc'+(u===MP.uid?' me':'')+(e[u]!==undefined?' out':'')+'">'+(e[u]!==undefined?'⚡':'')+esc(p.name)+'</span>';
  }).join('');
}
function mpStepOf(u){
  var r=MP.room, e=mpElim();
  if(e[u]!==undefined) return +e[u];
  return r.status==='finished'?NSTEP:r.rd;
}
function mpCam(){ var m=0; mpRoster().forEach(function(u){ m=Math.max(m,mpStepOf(u)); }); return m; }   // 鏡頭看活著的人（全員同一階）；全員出局就看最高的那階
function mpLayout(anim){
  var r=MP.room, ro=mpRoster(), N=ro.length; if(!N||!r) return;
  camTo(mpCam(),anim);
  var fac=N<=2?1:N<=4?.92:N<=7?.82:N<=10?.74:.66;
  var nf=Math.max(9,Math.min(12,12*fac+1)), nch=N>8?3:4, nameW=nch*nf*1.02+8, rowStep=Math.max(11,SPC*geo.s*.95);
  var groups={}; ro.forEach(function(u){ var st=mpStepOf(u); (groups[st]=groups[st]||[]).push(u); });
  MP.pos={};
  Object.keys(groups).forEach(function(st){
    var g=groups[st], k=g.length, f=footPos(+st), h=geo.hC*fac*f.sc, w=h*60/102;
    var span=(310-160*Math.min(+st,NSTEP)/NSTEP)*geo.s;                       // 這一階的石階寬度（越高越窄）
    var maxCols=Math.max(1,Math.floor(span/nameW)), rows=1; while(Math.ceil(k/rows)>maxCols&&rows<4) rows++;
    var cols=Math.ceil(k/rows), colSp=Math.min(span/cols,Math.max(w*1.4,nameW));
    g.forEach(function(u,i){
      var row=Math.floor(i/cols), col=i%cols, inRow=Math.min(cols,k-row*cols);
      var cx=f.x+(col-(inRow-1)/2)*colSp, fy=f.y-row*rowStep;
      var d=MP.figs[u]; if(!d) return;
      d.classList.toggle('mv',!!anim);
      d.style.width=w.toFixed(1)+'px'; d.style.height=h.toFixed(1)+'px'; d.style.zIndex=String(Math.round(fy)+(u===MP.uid?1:0));
      d.style.setProperty('--nf',nf.toFixed(1)+'px');
      d.style.transform='translate('+(cx-w/2).toFixed(1)+'px,'+(fy-.956*h).toFixed(1)+'px)';
      MP.pos[u]={x:cx,y:fy,h:h};
    });
  });
  var e=mpElim(); ro.forEach(function(u){ var d=MP.figs[u]; if(d){ d.classList.toggle('hit',e[u]!==undefined); d.classList.toggle('out',e[u]!==undefined); } });
}
window.addEventListener('resize',function(){ if(MP.on&&MP.inGame){ measure(); mpLayout(false); } });

function mpGame(){
  var r=MP.room;
  if(!MP.inGame){ mpSetup(); }
  var key=[r.status,r.n,r.rd,r.ph].join('|');
  mpStrip(); mpHud();
  if(key===MP.key){ mpLayout(true); return; }
  var prev=MP.key; MP.key=key; MP.stall=0; MP.stallShown=false;
  if(r.status==='finished'){ mpFinish(); return; }
  if(r.ph==='ready'){ MP.countT=3; MP.lastC=0; S.phase='wait'; S.locked=true; MP.wait=99; $('kb').classList.add('locked'); setInfo('<div class="tag">'+plain('mpReady')+'</div>'); $('ch').textContent='3'; mpLayout(true); return; }
  if(r.ph==='ask'){ mpLayout(true); S.phase='wait'; S.locked=true; MP.wait=prev&&r.rd>0?.85:.3; $('kb').classList.add('locked'); $('typedTxt').className=''; S.buf=''; renderTyped(); setInfo(''); setStorm(0); return; }

}
function mpHud(){

function mpShowQ(){

}
function mpSubmitted(ok){      // 打字送出（submit() 會呼叫）；先不揭曉，等房主宣布
  S.phase='ask'; $('kb').classList.add('locked'); setInfo('<span class="wt">'+plain('mpSent')+'</span>');
  var rd=MP.room.rd, code=MP.code;
  waitRM().then(function(rm){ return rm.answer(code,rd,ok); }).catch(function(){});
}
function mpTimeUp(){
  if(S.locked||!MP.canType) return;
  S.locked=true; S.tLeft=0; renderTimer(); $('kb').classList.add('locked');
  setInfo('<span class="wt">'+plain('timeup')+'</span>');
  var rd=MP.room.rd, code=MP.code;
  waitRM().then(function(rm){ return rm.answer(code,rd,false); }).catch(function(){});
}
function mpBolts(list){
  var parts=[], W=geo.W, Hh=geo.H;
  list.forEach(function(u){
    var p=MP.pos[u]; if(!p) return;
    var hx=p.x, hy=p.y-p.h*.86, pts=[[hx+(Math.random()*18-9),-12]], n=6;
    for(var i=1;i<n;i++) pts.push([hx+(Math.random()*26-13)*(1-i/n),-12+(hy+12)*i/n]);
    pts.push([hx,hy]);
    var ps=pts.map(function(q){ return q[0].toFixed(1)+','+q[1].toFixed(1); }).join(' ');
    parts.push('<polyline points="'+ps+'" fill="none" stroke="#F3D98A" stroke-width="8" stroke-linejoin="round" stroke-linecap="round" opacity=".55"/><polyline points="'+ps+'" fill="none" stroke="#FFFDF0" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><circle cx="'+hx.toFixed(1)+'" cy="'+p.y.toFixed(1)+'" r="'+(p.h*.3).toFixed(0)+'" fill="#FFF3B0" opacity=".5"/>');
  });
  var b=$('bolt'); b.setAttribute('viewBox','0 0 '+W+' '+Hh); b.innerHTML=parts.join('');
  b.classList.remove('on'); b.getBoundingClientRect(); b.classList.add('on');
}
function mpReveal(){
  var r=MP.room, rd=r.rd, e=mpElim(), q=BYCH[r.qs[rd]];
  if(q){ S.q=q; $('ch').textContent=chText(q); }
  S.phase='reveal'; S.locked=true; $('kb').classList.add('locked');

  var ans=q?q.r.map(readingText).join(' / '):'';
  var mine=e[MP.uid]===rd, inGame=mpAmIn();
  if(struck.length){
    mpBolts(struck); sfx('hit'); shake($('scene')); setStorm(1);
    var f=$('flash'); f.classList.remove('on'); void f.offsetWidth; f.classList.add('on');
    struck.forEach(function(u){ var d=MP.figs[u]; if(d){ d.classList.remove('zap'); void d.offsetWidth; d.classList.add('zap'); } });
  }else{ setStorm(0); }
  if(surv.length){ surv.forEach(function(u){ var d=MP.figs[u]; if(d){ d.classList.remove('hop'); void d.offsetWidth; d.classList.add('hop'); } }); if(!struck.length) sfx('ok'); }
  var head;
  if(inGame&&mine){ head='<div class="tag">'+plain('struck')+'</div>'; $('typedTxt').className='bad'; }
  else if(inGame&&e[MP.uid]===undefined){ head='<span class="good">✓ '+(q?chText(q):'')+'</span>　'; $('typedTxt').className='done'; }
  else head='';
  setInfo(head+(mine||!inGame||e[MP.uid]!==undefined?plain('answer')+'：<span class="ans">'+ans+'</span>':ans));
  if(inGame&&!mine&&e[MP.uid]===undefined){ setInfo('<span class="good">✓ '+(q?chText(q):'')+'　'+ans+'</span>'); }
  S.tLeft=0; renderTimer();
}
function mpFinish(){
  var r=MP.room; S.phase='end'; S.locked=true; $('kb').classList.add('locked');

function mpResults(){

  var medals=['🥇','🥈','🥉'];

    return '<div class="lbRow'+(x.uid===MP.uid?' me':'')+'"><span class="lbRank">'+(rk<=3?medals[rk-1]:rk)+'</span><span class="lbName">'+esc(x.name)+'</span><span class="lbVal"><b>'+(x.r>=NSTEP?'🏔 '+zh('mpTop'):mpTxt('mpSteps',x.r))+'</b></span></div>';
  }).join('');

  });
  $('mpLeaveBtn').addEventListener('click',mpLeave);

/* 「繼續留下」之後，把原本該顯示的浮層補回去（比賽結果） */
function mpSyncOverlay(){ if(MP.on&&MP.room&&MP.room.status==='finished'&&MP.shown==='res'+MP.room.n) mpResults(); }

/* ---------- 每一格畫面：倒數、作答時間、房主推進回合 ---------- */
function mpFrame(dt){
  var r=MP.room; if(!r||!MP.inGame||r.status==='waiting') return;
  if(r.status==='playing'&&r.ph==='ready'){
    MP.countT-=dt; var c=Math.max(1,Math.ceil(MP.countT));
    if(c!==MP.lastC){ MP.lastC=c; $('ch').textContent=String(c); sfx('tick'); }
  }
  if(S.phase==='wait'&&r.ph==='ask'){ MP.wait-=dt; if(MP.wait<=0) mpShowQ(); }
  else if(S.phase==='ask'&&r.ph==='ask'){
    S.tLeft=Math.max(0,S.tLeft-dt);
    var sec=Math.ceil(S.tLeft); if(sec!==S.lastSec){ S.lastSec=sec; if(sec>0&&sec<=3&&MP.canType&&!S.locked) sfx('tick'); }
    renderTimer(); setStorm(Math.pow(1-S.tLeft/S.T,1.6)*(MP.canType?1:.6));
    if(S.tLeft<=0&&!S.locked&&MP.canType) mpTimeUp();
  }
  if(r.status==='playing'){
    MP.stall+=dt;
    if(!MP.stallShown&&MP.stall>P.T+20){ MP.stallShown=true; setInfo('<span class="wt">'+plain('mpStall')+'</span>'); }
  }
  if(MP.host) mpHostFrame(dt);
}
function mpHostFrame(dt){
  var r=MP.room, H=MP.H, key=[r.status,r.ph,r.rd,r.n].join('|');
  if(H.key!==key){ H.key=key; H.t=0; H.busy=false; }
  H.t+=dt;
  if(H.busy||r.status!=='playing') return;
  function go(patch){ H.busy=true; waitRM().then(function(rm){ return rm.hostSet(MP.code,patch); }).catch(function(){ setTimeout(function(){ H.busy=false; },1500); }); }
  var e=mpElim(), ro=mpRoster(), rd=r.rd;
  if(r.ph==='ready'){ if(H.t>=3.2) go({ph:'ask'}); return; }
  if(r.ph==='ask'){
    var alive=ro.filter(function(u){ return e[u]===undefined; });
    var all=alive.every(function(u){ var p=MP.pl[u]; return p&&p.a&&p.a[String(rd)]!==undefined; });
    if((all&&H.t>=.9)||H.t>=P.T+.85+2.5){
      var ne={}; Object.keys(e).forEach(function(u){ ne[u]=e[u]; });
      alive.forEach(function(u){ var p=MP.pl[u]; if(!(p&&p.a&&p.a[String(rd)]===1)) ne[u]=rd; });
      go({ph:'reveal',elim:ne});
    }
    return;
  }
  if(r.ph==='reveal'){
    if(H.t<2.2) return;
    var left=ro.filter(function(u){ return e[u]===undefined; });
    if(rd>=NSTEP-1||!left.length){
      var fin=ro.map(function(u){ var p=MP.pl[u]||{name:'?',g:'m',ci:0}; return {uid:u,name:p.name,g:p.g,ci:p.ci,r:e[u]!==undefined?+e[u]:NSTEP}; }).sort(function(a,b){ return b.r-a.r; });
      go({status:'finished',ph:'end',final:fin});
    }else go({ph:'ask',rd:rd+1});
  }
}

  apiKey: "AIzaSyC_YSDn2OH6_GKKwCq0d8QFNl3fYXzTC60",
  authDomain: "memorma-24dab.firebaseapp.com",
  projectId: "memorma-24dab",
  storageBucket: "memorma-24dab.firebasestorage.app",

  const nOf = board => { const m = /_(15|20|25)$/.exec(board); return m ? +m[1] : 10; };

  window.LB = {
    async top(board){

  const MAXP = 15, ROOM_MS = 6 * 3600 * 1000;

          qs: [], ro: [], elim: {}, final: [], createdAt: serverTimestamp(), expireAt: Timestamp.fromMillis(Date.now() + ROOM_MS) };
        await setDoc(roomRef(code), data);

          try{ const old = await getDocs(collection(db, 'rayo_rooms', code, 'players'));
               await Promise.all(old.docs.map(d => deleteDoc(d.ref))); }catch(e){}
        }
        await setDoc(meRef(code, uid), { name, g: o.g, ci: o.ci, want: !!o.want, spec: !!o.want, a: {}, joinedAt: serverTimestamp() });
        return code;
      }
      throw new Error('nocode');
    },
    /* 加入：回傳 {ok, spec} 或 {ok:false, why:'none'|'closed'|'full'} */
    async join(code, o){
      const uid = await ensureUid(), name = cleanName(o.name);
      if(!/^[0-9]{4}$/.test(code)) return { ok:false, why:'none' };
      const snap = await getDoc(roomRef(code));
      if(!snap.exists()) return { ok:false, why:'none' };

      if(mine) return { ok:true, spec: !!mine.data().spec, again:true };
      const spec = !!o.want || r.status !== 'waiting';
      await setDoc(meRef(code, uid), { name, g: o.g, ci: o.ci, want: !!o.want, spec, a: {}, joinedAt: serverTimestamp() });
      return { ok:true, spec };
    },
    /* 即時收房間與玩家名單；回傳取消用的函式 */
    listen(code, onRoom, onPlayers, onErr){
      const u1 = onSnapshot(roomRef(code), s => onRoom(s.exists() ? { ...s.data({ serverTimestamps:'estimate' }), code } : null), e => onErr && onErr(e));
      const u2 = onSnapshot(collection(db, 'rayo_rooms', code, 'players'), s => onPlayers(s.docs.map(d => ({ ...d.data({ serverTimestamps:'estimate' }), uid: d.id }))), e => onErr && onErr(e));
      return () => { try{ u1(); }catch(e){} try{ u2(); }catch(e){} };
    },
    async hostSet(code, patch){ await updateDoc(roomRef(code), patch); },
    async me(code, patch){ const uid = await ensureUid(); await updateDoc(meRef(code, uid), patch); },
    async answer(code, rd, ok){ const uid = await ensureUid(); await updateDoc(meRef(code, uid), { ['a.' + rd]: ok ? 1 : 0 }); },
    /* 離開：房主＝關房間；一般玩家＝等人階段把自己刪掉，比賽中保留紀錄（沒答題會被當成答錯） */
    async leave(code, o){
      const uid = await ensureUid();
      if(o.host){ await updateDoc(roomRef(code), { status:'closed' }); return; }
      if(o.waiting){ await deleteDoc(meRef(code, uid)); }
    }
  };

}catch(e){ console.error('Firebase 初始化失敗', e); }
</script>
<script>/* ===== 一鍵靜音（只關音樂和音效，不影響念字的語音）— 每天一分鐘遊戲統一做法 ===== */
(function(){
  var KEY='hg.mute.rayo', MOUNT='', muted=false, masters=[];
  try{ muted = localStorage.getItem(KEY)==='1'; }catch(e){}
  /* 讓這個遊戲建立的所有 Web Audio 聲音，都先經過一個總音量；靜音＝總音量 0 */
  try{
    var BP = window.BaseAudioContext ? window.BaseAudioContext.prototype : (window.AudioContext||window.webkitAudioContext).prototype;
    var desc = Object.getOwnPropertyDescriptor(BP,'destination');
    if(desc && desc.get){
      Object.defineProperty(BP,'destination',{configurable:true,get:function(){
        var real = desc.get.call(this);
        if(!this.__hgMaster){
          try{ var g=this.createGain(); g.gain.value = muted?0:1; g.connect(real); this.__hgMaster=g; masters.push(g); }
          catch(e){ return real; }
        }
        return this.__hgMaster;
      }});
    }
  }catch(e){}
  /* 備用的 <audio> 播放（例如 iPhone 的 Chrome）也一起靜音 */
  try{
    var op = HTMLMediaElement.prototype.play;
    HTMLMediaElement.prototype.play = function(){ this.muted = muted; return op.apply(this, arguments); };
  }catch(e){}
  function apply(){ masters.forEach(function(g){ try{ g.gain.setValueAtTime(muted?0:1, g.context.currentTime); }catch(e){ g.gain.value = muted?0:1; } }); }
  function build(){
    if(document.getElementById('hgMute')) return;
    var st=document.createElement('style');
    st.textContent='#hgMute{position:fixed;right:10px;top:10px;z-index:2147483000;width:40px;height:40px;border-radius:50%;border:1px solid rgba(0,0,0,.28);background:rgba(255,255,255,.88);color:#222;font-size:19px;line-height:1;padding:0;cursor:pointer;box-shadow:0 1px 4px rgba(0,0,0,.25);touch-action:manipulation;-webkit-tap-highlight-color:transparent}#hgMute:active{transform:scale(.94)}#hgMute.st{position:static;flex:0 0 40px;margin:0 0 0 8px}';
    document.head.appendChild(st);
    var b=document.createElement('button'); b.type='button'; b.id='hgMute';
    function paint(){ b.textContent = muted?'🔇':'🔊'; b.setAttribute('aria-pressed', muted?'true':'false');
      b.title = b.ariaLabel = muted ? '開啟音樂和音效 · Activar música y efectos' : '靜音（音樂和音效）· Silenciar música y efectos'; apply(); }
    b.addEventListener('click',function(e){ e.stopPropagation(); muted=!muted; try{ localStorage.setItem(KEY, muted?'1':'0'); }catch(err){} paint(); });
    b.addEventListener('pointerdown',function(e){ e.stopPropagation(); });
    paint();
    var anchor = MOUNT && document.querySelector(MOUNT);
    if(anchor && anchor.parentNode){ b.className='st'; anchor.parentNode.insertBefore(b, anchor.nextSibling); } else document.body.appendChild(b);
  }
  if(document.body) build(); else document.addEventListener('DOMContentLoaded', build);
})();
/* ===== /一鍵靜音 ===== */
</script>

<script>/* ===== 找不到中文聲音的提示（每天一分鐘遊戲統一做法）===== */
(function(){
  var shown=false;
  function cfg(){ var s={}; try{ s=JSON.parse(localStorage.getItem('hanziGames.settings')||'{}')||{}; }catch(e){} return s; }
  function isMandarin(v){ var l=String((v&&v.lang)||'').toLowerCase().replace(/_/g,'-'); if(l.indexOf('yue')===0||l.indexOf('zh-hk')===0) return false; return l==='zh'||l.indexOf('zh-')===0||l.indexOf('cmn')===0; }
  var T={
    none:{ zh:['這個裝置找不到中文（台灣）語音，聽不到念的內容。請到手機設定安裝「中文（台灣）」語音，或換一個裝置。','这个装置找不到中文（台湾）语音，听不到念的内容。请到手机设置安装「中文（台湾）」语音，或换一个装置。'],
           es:'No se encontró una voz de chino (Taiwán) en este dispositivo, así que no se oirá el audio. Instala la voz «chino (Taiwán)» en los ajustes del móvil o usa otro dispositivo.',
           en:'No Chinese (Taiwan) voice was found on this device, so you won’t hear the audio. Install the “Chinese (Taiwan)” voice in your phone settings, or use another device.' },
    nosynth:{ zh:['這個瀏覽器不支援語音，聽不到念的內容。請換一個瀏覽器（例如 Chrome、Safari）。','这个浏览器不支持语音，听不到念的内容。请换一个浏览器（例如 Chrome、Safari）。'],
           es:'Este navegador no admite voz, así que no se oirá el audio. Usa otro navegador (por ejemplo Chrome o Safari).',
           en:'This browser does not support speech, so you won’t hear the audio. Try another browser (for example Chrome or Safari).' }
  };
  function show(kind){
    if(shown||document.getElementById('hgVoiceHint')) return; shown=true;
    var s=cfg(), lang=s.lang||'es', simp=s.script==='simp', t=T[kind];
    var st=document.createElement('style');
    st.textContent='#hgVoiceHint{position:fixed;left:50%;top:8px;transform:translateX(-50%);z-index:2147482999;width:min(94vw,520px);box-sizing:border-box;display:flex;gap:8px;align-items:flex-start;padding:8px 10px;border-radius:12px;background:#fff6dc;border:1px solid #d8b24a;color:#5b4410;font:13px/1.4 system-ui,-apple-system,"Noto Sans TC","PingFang TC",sans-serif;box-shadow:0 2px 10px rgba(0,0,0,.25)}#hgVoiceHint .m{flex:1}#hgVoiceHint .m small{display:block;font-size:11px;opacity:.85;margin-top:2px}#hgVoiceHint button{border:0;background:transparent;color:inherit;font-size:16px;line-height:1;padding:0 2px;cursor:pointer}';
    document.head.appendChild(st);
    var d=document.createElement('div'); d.id='hgVoiceHint'; d.setAttribute('role','status');
    var m=document.createElement('div'); m.className='m';
    var zh=document.createElement('div'); zh.textContent = simp ? t.zh[1] : t.zh[0]; m.appendChild(zh);
    if(lang!=='zh'){ var sm=document.createElement('small'); sm.textContent = lang==='en' ? t.en : t.es; m.appendChild(sm); }
    var x=document.createElement('button'); x.type='button'; x.textContent='✕'; x.setAttribute('aria-label','Close');
    x.addEventListener('click',function(){ d.remove(); });
    d.appendChild(m); d.appendChild(x); document.body.appendChild(d);
  }
  function check(){
    try{
      if(!window.speechSynthesis){ show('nosynth'); return; }
      var vs=window.speechSynthesis.getVoices()||[];
      if(vs.length && !vs.some(isMandarin)) show('none');   // 清單是空的時（有些手機一開始就是空的）先不判斷
    }catch(e){}
  }
  function start(){
    check();
    try{ window.speechSynthesis.addEventListener('voiceschanged', check); }catch(e){}
    setTimeout(check,1500); setTimeout(check,4000);
  }
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded', start); else start();
})();
/* ===== /找不到中文聲音的提示 ===== */
</script>
<script>
/* ===== 遊玩紀錄（hgPlays）— 每個遊戲共用，貼在 </body> 前 =====
   用法：
     HGPlays.visit();                       // 頁面打開時（本檔會自動呼叫一次）
     HGPlays.start('easy', '小明');         // 真的開始玩一局（關卡／難度、暱稱都可省略）
     HGPlays.end({score: 120, name: '小明'}); // 這一局正常結算（score、name 可省略）
   沒呼叫 end 的那一局，後台就會顯示「沒玩完」。
   寫到 memorma 專案：plays（每局）、visits（每台裝置每天每遊戲一筆）。
   任何錯誤都靜默，不影響遊戲。 */
(function () {
  var GAME = 'rayo';          // ← 每個遊戲改成自己的代號（英文小寫、底線）
  var NAME_GETTER = null;                // ← 可選：function(){ return 目前暱稱或'' }
  var CFG = { apiKey: 'AIzaSyC_YSDn2OH6_GKKwCq0d8QFNl3fYXzTC60', authDomain: 'memorma-24dab.firebaseapp.com',
              projectId: 'memorma-24dab', appId: '1:806709458465:web:f0d12acb2f911f2f165560' };
  var V = '10.12.2', CDN = 'https://www.gstatic.com/firebasejs/' + V + '/';
  var cur = null, readyP = null, lib = null;

  function gid() { try { return (HG.gameFn ? HG.gameFn() : GAME) || GAME; } catch (e) { return GAME; } } // taiwan-life 這類共用引擎的遊戲可改寫 HGPlays.gameFn
  function day() { // 以台灣時間（UTC+8）算「哪一天」，方便老師對帳
    var d = new Date(Date.now() + 8 * 3600e3);
    return d.toISOString().slice(0, 10);
  }
  function ls(k, v) {
    try { if (v === undefined) return localStorage.getItem(k); localStorage.setItem(k, v); } catch (e) {}
    return null;
  }
  function ready() {
    if (readyP) return readyP;
    readyP = (async function () {
      var A = await import(CDN + 'firebase-app.js');
      var Au = await import(CDN + 'firebase-auth.js');
      var F = await import(CDN + 'firebase-firestore.js');
      var app = A.initializeApp(CFG, 'hgplays');
      var auth = Au.getAuth(app);
      if (!auth.currentUser) await Au.signInAnonymously(auth);
      else await auth.authStateReady();
      lib = { F: F, db: F.getFirestore(app), uid: auth.currentUser.uid };
      return lib;
    })().catch(function () { readyP = null; return null; });
    return readyP;
  }
  function getName(n) {
    if (n) return String(n).slice(0, 36);
    try { if (NAME_GETTER) return String(NAME_GETTER() || '').slice(0, 36); } catch (e) {}
    return '';
  }

  var HG = window.HGPlays = {
    /* 每台裝置每天、每個遊戲只算一次訪客 */
    visit: function () {
      var g = gid(), d = day(), key = 'hg.visit.' + g;
      if (ls(key) === d) return;
      ready().then(function (L) {
        if (!L) return;
        var id = d + '_' + g + '_' + L.uid;
        return L.F.setDoc(L.F.doc(L.db, 'visits', id), { game: g, day: d, uid: L.uid, at: L.F.serverTimestamp() })
          .then(function () { ls(key, d); });
      }).catch(function () {});
    },
    /* 真的開始玩一局 */
    start: function (level, name) {
      var mine = cur = { id: null, level: level == null ? '' : String(level).slice(0, 30) };
      ready().then(function (L) {
        if (!L) return;
        var data = { game: gid(), level: mine.level, uid: L.uid, name: getName(name), day: day(),
                     startedAt: L.F.serverTimestamp(), done: false };
        return L.F.addDoc(L.F.collection(L.db, 'plays'), data).then(function (ref) {
          mine.id = ref.id; if (mine.pendingEnd) HG._finish(mine, mine.pendingEnd);
        });
      }).catch(function () {});
    },
    /* 這一局正常結算 */
    end: function (info) {
      var mine = cur; if (!mine || mine.ended) return; mine.ended = true; info = info || {};
      if (mine.id) HG._finish(mine, info); else mine.pendingEnd = info; // 開始的寫入還沒回來就先記著
    },
    _finish: function (mine, info) {
      ready().then(function (L) {
        if (!L || !mine.id) return;
        var u = { done: true, endedAt: L.F.serverTimestamp(),
                  secs: Math.max(0, Math.min(86400, Math.round(Number(info.secs != null ? info.secs : (Date.now() - (mine.t0 || Date.now())) / 1000) || 0))) };
        var s = Number(info.score); if (isFinite(s) && info.score != null) u.score = Math.max(-1e9, Math.min(1e9, Math.round(s)));
        var n = getName(info.name); if (n) u.name = n;
        return L.F.updateDoc(L.F.doc(L.db, 'plays', mine.id), u);
      }).catch(function () {});
    }
  };
  var _s = HG.start; HG.start = function (l, n) { _s(l, n); if (cur) cur.t0 = Date.now(); };
  setTimeout(function () { HG.visit(); }, 2500);   // 等遊戲載完再記訪客
})();
</script>
